name: Keep Supabase Alive

on:
  schedule:
    # Roda a cada 2 dias às 6:00 UTC (3:00 BRT)
    - cron: '0 6 */2 * *'
  # Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            || echo "Ping falhou, mas continuamos"